name: CI

on:
  push:
    branches: [main]
  pull_request:

# Kapuk (ARCHITECTURE.md §22.2): typecheck · lint · i18n · unit · build · e2e (+ a11y) · production e2e (CSP, PWA).
# Az „authed" e2e az élő teszt-fiókot használja: csak akkor fut érdemben, ha a repo titkai közt van E2E_EMAIL / E2E_PASSWORD
# és a repo változói közt a publikus NEXT_PUBLIC_SUPABASE_* (különben a tesztek maguktól kimaradnak). Titok nem kerül a naplóba (H3).

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ddvzslgwexvdolovqqlg.supabase.co
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # csak publikus, helyőrző érték: a prod projekt kulcsait a CI ebben a jobban nem kapja meg (H3)
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: web
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # nyilvános oldalak: 360 / 1280 px, majd az axe-átfutás (kijelentkezve elérhető oldalak)
      - run: npm run test:e2e
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  e2e-prod:
    runs-on: ubuntu-latest
    needs: web
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # production build + nonce-os CSP + PWA (a belépést igénylő PWA-tesztek fiók nélkül kimaradnak)
      - run: npm run test:e2e:prod

  e2e-authed:
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push'
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # közös teszt-fiók → csak sorban (--workers=1); fiók nélkül a tesztek kimaradnak
      - run: npm run test:e2e:authed
